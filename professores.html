<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professores | Portfólio Acadêmico</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="paginas.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="painel.html">
                <span class="brand-mark">P</span>
                <span class="brand-name">Portfólio Acadêmico<span class="brand-subtitle">Painel de visualização</span></span>
            </a>

            <p class="nav-label">MENU PRINCIPAL</p>
            <nav class="nav-menu" aria-label="Menu principal">
                <a class="nav-link" href="painel.html"><span class="nav-icon">▦</span> Página inicial</a>
                <a class="nav-link active" href="professores.html"><span class="nav-icon">✎</span> Professores</a>
                <a class="nav-link" href="turmas.html"><span class="nav-icon">♧</span> Turmas</a>
                <a class="nav-link" href="alunos.html"><span class="nav-icon">♙</span> Alunos</a>
                <a class="nav-link" href="projetos.html"><span class="nav-icon">◇</span> Projetos</a>
                <a class="nav-link" href="portfolios.html"><span class="nav-icon">▤</span> Portfólios</a>
                <a class="nav-link" href="meu-portfolio/index.html" target="_blank" rel="noopener"><span class="nav-icon">★</span> Meu portfólio</a>
            </nav>

            <div class="sidebar-bottom">
                <a class="logout-link" href="index.html" data-sair>← Sair do sistema</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <p class="breadcrumb">Portfólio Acadêmico <span>/ Professores</span></p>
                <div class="topbar-right"><span class="user-name" id="userName"></span><div class="avatar" id="userAvatar">PA</div></div>
            </header>

            <section class="section-heading">
                <div><p class="eyebrow">CADASTRO</p><h2>Professores</h2></div>
                <button class="btn btn-primary" type="button" id="btnNovo">+ Novo professor</button>
            </section>

            <div class="alert" id="aviso" role="status" aria-live="polite" hidden></div>

            <section class="panel" id="painelForm" hidden>
                <h3 id="tituloForm"></h3>
                <form id="crudForm" novalidate>
                    <div class="form-grid" id="campos"></div>
                    <div class="form-actions">
                        <button class="btn btn-primary" type="submit" id="btnSalvar">Salvar</button>
                        <button class="btn btn-secondary" type="button" id="btnCancelar">Cancelar</button>
                    </div>
                </form>
            </section>

            <section class="panel panel-table">
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Nome</th><th>E-mail</th><th>Turmas</th><th class="col-acoes">Ações</th></tr></thead>
                        <tbody id="lista"></tbody>
                    </table>
                </div>
                <p class="empty" id="vazio" hidden>Nenhum professor cadastrado ainda.</p>
            </section>
        </main>
    </div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/crud.js"></script>
    <script src="js/professores.js"></script>
</body>
</html>
